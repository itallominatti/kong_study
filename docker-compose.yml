services:
  kong-db:
    image: postgres:15-alpine
    container_name: kong-db
    restart: on-failure
    networks:
      - kong-net
    environment:
      POSTGRES_DB: kong
      POSTGRES_USER: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong -d kong"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  kong-migrations:
    image: kong:3.6.0
    container_name: kong-migrations
    restart: "no"
    networks:
      - kong-net
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
    command: kong migrations bootstrap

  kong:
    image: kong:3.6.0
    container_name: kong_api_gateway
    restart: always
    networks:
      - kong-net
    ports:
      - "8000:8000"   # Proxy
      - "8001:8001"   # Admin
      - "8443:8443"   # Proxy SSL
      - "8444:8444"   # Admin SSL
    depends_on:
      kong-db:
        condition: service_healthy
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_PORT: 5432
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

networks:
  kong-net:
    driver: bridge

volumes:
  kong-postgres-data: